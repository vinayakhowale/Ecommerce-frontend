server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Allow file uploads up to 20 MB (nginx default is only 1 MB)
    client_max_body_size 20m;

    # Compress text responses
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---------------------------------------------------------------
    # API calls -> Spring Boot backend on Railway
    # "^~" makes this win over the static-file rule below.
    # No path after the domain: /api/x is forwarded as /api/x.
    # ---------------------------------------------------------------
    location ^~ /api {
        proxy_pass https://ecommerce-banked-production.up.railway.app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $proxy_host;
        proxy_ssl_server_name on;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ---------------------------------------------------------------
    # Uploaded files (product images etc.) -> backend
    # ---------------------------------------------------------------
    location ^~ /uploads/ {
        proxy_pass https://ecommerce-banked-production.up.railway.app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $proxy_host;
        proxy_ssl_server_name on;
    }

    # ---------------------------------------------------------------
    # Static assets of the Angular build (hashed file names) - cache
    # ---------------------------------------------------------------
    location ~* \.(?:css|js|woff2?|ttf|png|jpg|jpeg|gif|svg|ico|webp)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # ---------------------------------------------------------------
    # Angular routing - unknown paths fall back to index.html
    # ---------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
