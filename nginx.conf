server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Angular routing - always fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend service (adjust host:port to your deployment)
location /api {
    proxy_pass https://ecommerce-banked-production.up.railway.app;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $proxy_host;
    proxy_ssl_server_name on;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
    location /uploads/ {
        proxy_pass http://backend:8080/uploads/;
    }

    location ~* \.(?:css|js|woff2?|png|jpg|jpeg|svg)$ {
        expires 30d;
        access_log off;
    }
}
