server {
    listen ${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Allow large image/video uploads (default is only 1 MB)
    client_max_body_size 200m;
    client_body_timeout 300s;

    # Compress text files
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Angular routing - always fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache index.html, so new deployments show up immediately
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # API calls -> Spring Boot backend on Railway
    location ^~ /api/ {
        proxy_pass ${BACKEND_URL}/api/;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Stream large uploads straight to the backend
        proxy_request_buffering off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Uploaded images/videos served by the backend
    location ^~ /uploads/ {
        proxy_pass ${BACKEND_URL}/uploads/;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
    }

    # Cache Angular's static build files
    location ~* \.(?:css|js|woff2?|ttf|png|jpg|jpeg|gif|svg|ico|webp)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }
}
